<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#efebe4">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>抱抱鴨 3D</title>
<style>
  html, body { margin: 0; height: 100%; background: #efebe4; overflow: hidden; overscroll-behavior: none; }
  /* 關掉連點放大、長按選字 */
  * { touch-action: manipulation; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  input { -webkit-user-select: text; user-select: text; }
  body { font-family: -apple-system, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif; color: #5b5348; }
  canvas { display: block; width: 100vw; height: 100vh; height: 100dvh; touch-action: none; outline: none; }
  .title { position: fixed; top: calc(env(safe-area-inset-top) + 18px); left: 0; right: 0; text-align: center; pointer-events: none; }
  .title h1 { margin: 0; font-size: 22px; letter-spacing: 2px; font-weight: 800; }
  .title p { margin: 4px 0 0; font-size: 13px; opacity: .65; }
  .hint { position: fixed; bottom: calc(env(safe-area-inset-bottom) + 14px); left: 50%; transform: translateX(-50%);
          background: rgba(255,255,255,.75); padding: 8px 16px; border-radius: 999px; font-size: 13px; white-space: nowrap;
          box-shadow: 0 2px 10px rgba(0,0,0,.06); pointer-events: none; transition: opacity .8s; }
  .hint.hide { opacity: 0; }
  .bubble { position: fixed; transform: translate(-10%, -100%) scale(.4); opacity: 0; pointer-events: none;
            background: #fff; border: 3px solid #1b1b1b; border-radius: 20px; padding: 8px 16px;
            font-size: 22px; font-weight: 800; color: #1b1b1b; white-space: nowrap;
            transition: opacity .2s, transform .35s cubic-bezier(.3,1.6,.5,1); }
  .bubble::after { content: ""; position: absolute; left: 18px; bottom: -14px; width: 16px; height: 16px;
            background: #fff; border-right: 3px solid #1b1b1b; border-bottom: 3px solid #1b1b1b; transform: rotate(45deg) skew(10deg,10deg); }
  .bubble.show { opacity: 1; transform: translate(-10%, -100%) scale(1); }
  .action { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom) + 64px);
            min-width: 180px; padding: 16px 28px; font-size: 22px; font-weight: 900; letter-spacing: 2px;
            color: #1b1b1b; background: #ffc35a; border: 3px solid #1b1b1b; border-radius: 999px;
            box-shadow: 0 5px 0 #1b1b1b; -webkit-tap-highlight-color: transparent; touch-action: manipulation; user-select: none; -webkit-user-select: none; }
  .action:active { transform: translateX(-50%) translateY(4px); box-shadow: 0 1px 0 #1b1b1b; }
  .action:disabled { background: #efe4cf; color: #8a8072; }
  .score { position: fixed; top: calc(env(safe-area-inset-top) + 74px); left: 0; right: 0; text-align: center;
            font-size: 14px; font-weight: 700; pointer-events: none; }
  .toast { position: fixed; top: 34%; left: 50%; transform: translate(-50%, -50%) scale(.6); opacity: 0;
            font-size: 30px; font-weight: 900; color: #1b1b1b; text-shadow: 0 2px 0 #fff, 0 -2px 0 #fff, 2px 0 0 #fff, -2px 0 0 #fff;
            pointer-events: none; transition: opacity .15s, transform .3s cubic-bezier(.3,1.6,.5,1); white-space: nowrap; }
  .toast.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  .hidden { display: none !important; }
  .panel { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(86vw, 340px);
           background: rgba(255,255,255,.95); border: 3px solid #1b1b1b; border-radius: 22px; padding: 20px 18px;
           box-shadow: 0 6px 0 #1b1b1b; display: flex; flex-direction: column; gap: 12px; text-align: center; }
  .panel h2 { margin: 0 0 4px; font-size: 20px; color: #1b1b1b; }
  .panel button { font: inherit; font-weight: 800; border: 2.5px solid #1b1b1b; border-radius: 14px; padding: 10px 14px;
           background: #fff; color: #1b1b1b; box-shadow: 0 3px 0 #1b1b1b; -webkit-tap-highlight-color: transparent; }
  .panel button.big { font-size: 19px; padding: 14px; background: #ffc35a; }
  .panel button:active { transform: translateY(2px); box-shadow: 0 1px 0 #1b1b1b; }
  .panel button.link { border: none; box-shadow: none; background: none; font-weight: 600; color: #6b6255; }
  .panel input { font: inherit; font-size: 17px; padding: 10px 12px; border: 2.5px solid #1b1b1b; border-radius: 12px; min-width: 0; text-align: center; }
  .panel .row, .card .row { display: flex; gap: 8px; } .panel .row input { flex: 1; } .card .row button { flex: 1; }
  .tabs { display: flex; gap: 6px; } .tabs .tab { flex: 1; padding: 8px; font-size: 15px; } .tabs .tab.on { background: #ffc35a; }
  .list { list-style: none; margin: 0; padding: 0; max-height: 44vh; overflow: auto; text-align: left; font-size: 15px; color: #1b1b1b; }
  .list li { display: flex; gap: 10px; align-items: center; padding: 7px 4px; border-bottom: 1px dashed #d8cfbf; }
  .list .rk { width: 2em; text-align: center; font-weight: 800; } .list .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .list .sc { font-weight: 800; }
  .card { position: fixed; left: 50%; top: calc(env(safe-area-inset-top) + 120px); transform: translateX(-50%); width: min(86vw, 320px);
          background: rgba(255,255,255,.96); border: 3px solid #1b1b1b; border-radius: 18px; padding: 14px; box-shadow: 0 5px 0 #1b1b1b;
          display: flex; flex-direction: column; gap: 10px; text-align: center; }
  .card button { font: inherit; font-weight: 800; border: 2.5px solid #1b1b1b; border-radius: 12px; padding: 9px 10px; background: #fff; color: #1b1b1b; box-shadow: 0 3px 0 #1b1b1b; }
  .card button.big { background: #ffc35a; } .card button.link { border: none; box-shadow: none; background: none; font-weight: 600; color: #6b6255; padding: 2px; }
  .card .msg { font-size: 15px; font-weight: 700; white-space: pre-line; color: #1b1b1b; }
  .panel .msg { font-size: 14px; white-space: pre-line; color: #4a4339; min-height: 1em; }
  .room { position: fixed; top: calc(env(safe-area-inset-top) + 96px); left: 0; right: 0; text-align: center; font-size: 13px; color: #6b6255; pointer-events: none; }
  .menu-btn { position: fixed; top: calc(env(safe-area-inset-top) + 14px); left: 12px; font: inherit; font-size: 13px; font-weight: 700;
           background: rgba(255,255,255,.8); border: 2px solid #1b1b1b; border-radius: 999px; padding: 5px 10px; color: #1b1b1b; }
  .mute-btn { position: fixed; top: calc(env(safe-area-inset-top) + 14px); right: 12px; font-size: 16px; line-height: 1;
           background: rgba(255,255,255,.8); border: 2px solid #1b1b1b; border-radius: 999px; padding: 5px 9px; }
  .hap-btn { right: 58px; }
  .ic { display: inline-block; vertical-align: -0.22em; flex: none; }
  button .ic, h2 .ic, .toast .ic, .hint .ic { margin: 0 .3em; }
  .panel button, .action, .card button, .menu-btn { display: inline-flex; align-items: center; justify-content: center; gap: 2px; }
  .mute-btn { display: inline-flex; align-items: center; justify-content: center; padding: 4px 7px; }
  .mute-btn .ic { margin: 0; }
  .list .rk .ic { vertical-align: middle; margin: 0; }
  .dexlist { list-style: none; margin: 0; padding: 0; max-height: 52vh; overflow: auto; text-align: left; }
  .dexlist li { display: flex; align-items: center; gap: 10px; padding: 8px 4px; border-bottom: 1px dashed #d8cfbf; color: #1b1b1b; }
  .dexlist .dx-tx { flex: 1; display: flex; flex-direction: column; }
  .dexlist .dx-tx b { font-size: 16px; } .dexlist .dx-tx small { font-size: 12.5px; color: #6b6255; }
  .dexlist .dx-st { font-size: 12.5px; font-weight: 800; white-space: nowrap; display: inline-flex; align-items: center; gap: 2px; color: #8a6a1f; }
  .dexlist li.seen .dx-st { color: #8a8072; }
  .dexlist li.unknown .dx-ic { filter: grayscale(1) brightness(.6); opacity: .45; }
  .dexlist li.unknown b { color: #8a8072; letter-spacing: 2px; }
  .achv { position: fixed; left: 50%; top: calc(env(safe-area-inset-top) + 118px); transform: translate(-50%, -30px) scale(.8); opacity: 0;
          display: flex; align-items: center; gap: 10px; padding: 10px 18px 10px 12px; pointer-events: none; white-space: nowrap;
          background: linear-gradient(180deg, #fff3c4, #ffd56a); border: 3px solid #1b1b1b; border-radius: 18px; box-shadow: 0 5px 0 #1b1b1b; color: #1b1b1b; z-index: 5; }
  .achv small { display: block; font-size: 12px; font-weight: 800; color: #8a5a00; letter-spacing: 2px; }
  .achv b { display: block; font-size: 19px; font-weight: 900; }
  .achv .ic { margin: 0; }
  .achv.show { animation: achvIn .4s cubic-bezier(.3,1.6,.5,1) forwards, achvBlink .3s ease-in-out .45s 4 alternate; }
  @keyframes achvIn { to { opacity: 1; transform: translate(-50%, 0) scale(1); } }
  @keyframes achvBlink { from { filter: brightness(1); box-shadow: 0 5px 0 #1b1b1b, 0 0 0 0 rgba(255,213,106,0); }
                         to { filter: brightness(1.18); box-shadow: 0 5px 0 #1b1b1b, 0 0 0 10px rgba(255,213,106,.55); } }
  .action { white-space: nowrap; }
  .action:disabled { font-size: 17px; letter-spacing: 0; }
  #roomJoin.hidden { display: none !important; }
  .lobby { list-style: none; margin: 0; padding: 0; max-height: 34vh; overflow: auto; text-align: left; }
  .lobby li { display: flex; align-items: center; gap: 8px; padding: 6px 4px; border-bottom: 1px dashed #d8cfbf; font-size: 15px; font-weight: 700; color: #1b1b1b; }
  .lobby .ic { margin: 0; }
  #startBtn:disabled { background: #efe4cf; color: #8a8072; }
  .coins { position: fixed; top: calc(env(safe-area-inset-top) + 54px); left: 12px; display: inline-flex; align-items: center; gap: 4px;
           background: rgba(255,255,255,.85); border: 2px solid #1b1b1b; border-radius: 999px; padding: 2px 10px 2px 4px; font-size: 15px; color: #1b1b1b; pointer-events: none; }
  .coins .ic { margin: 0; }
  .coins.bump { animation: coinBump .45s cubic-bezier(.3,1.8,.5,1); }
  @keyframes coinBump { 0% { transform: scale(1); } 40% { transform: scale(1.3); } 100% { transform: scale(1); } }
  .shop-coins { display: flex; align-items: center; justify-content: center; gap: 4px; font-size: 16px; font-weight: 800; color: #1b1b1b; }
  .shop-coins small { font-size: 11.5px; color: #8a8072; font-weight: 600; margin-left: 4px; }
  .shop-coins .ic { margin: 0; }
  .shoplist { list-style: none; margin: 0; padding: 0; max-height: 46vh; overflow: auto; text-align: left; }
  .shoplist li { display: flex; align-items: center; gap: 10px; padding: 7px 2px; border-bottom: 1px dashed #d8cfbf; color: #1b1b1b; }
  .shoplist .sh-ic .ic { margin: 0; }
  .shoplist .sh-tx { flex: 1; display: flex; flex-direction: column; }
  .shoplist .sh-tx b { font-size: 16px; }
  .shoplist .sh-tx small { display: inline-flex; align-items: center; gap: 3px; font-size: 13px; font-weight: 800; color: #8a5a00; }
  .shoplist .sh-tx small .ic { margin: 0; }
  .shoplist button { padding: 7px 12px !important; font-size: 14px; min-width: 76px; }
  .shoplist button.buy { background: #ffc35a; }
  .shoplist button:disabled { background: #efe4cf; color: #8a8072; box-shadow: none; }
  .coin-float { position: fixed; top: calc(env(safe-area-inset-top) + 60px); left: 80px; font-size: 18px; font-weight: 900; color: #b8860b;
                text-shadow: 0 2px 0 #fff, 0 -2px 0 #fff, 2px 0 0 #fff, -2px 0 0 #fff; pointer-events: none; animation: coinFloat 1.1s ease-out forwards; }
  .coin-float.big { font-size: 24px; color: #e8524a; }
  @keyframes coinFloat { 0% { opacity: 0; transform: translateY(6px) scale(.6); } 20% { opacity: 1; transform: translateY(0) scale(1.15); } 100% { opacity: 0; transform: translateY(-26px) scale(1); } }
  .shoplist li.bundle { background: #fff4dc; border-radius: 12px; padding: 7px 6px; border-bottom: 0; margin-bottom: 4px; }
  .shoplist .sh-tx small s { color: #b0a796; font-weight: 600; margin-left: 2px; }
  .tabs .tab { font-size: 14px !important; padding: 8px 4px !important; }
  .shoplist li.section { font-size: 13px; font-weight: 800; color: #8a6a1f; border-bottom: 0; padding: 12px 2px 2px; }
  .shoplist .sh-tx small { flex-wrap: wrap; }
  #loading { position: fixed; inset: 0; display: grid; place-items: center; font-size: 15px; }
</style>
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.min.js" } }
</script>
</head>
<body>
<div id="loading">鴨鴨準備中…</div>
<div class="title"><h1>抱抱鴨</h1><p>360° 隨意轉著看</p></div>
<div class="bubble" id="bubble">收到鴨！</div>
<div class="toast" id="toast"></div>
<div class="score" id="score"></div>
<button class="action" id="action">開始遊戲</button>
<div class="room hidden" id="room"></div>
<button class="menu-btn" id="menuBtn"><span data-ic="menu" data-size="18"></span>選單</button>
<button class="mute-btn" id="muteBtn" aria-label="音效開關"></button>
<button class="mute-btn hap-btn" id="hapBtn" aria-label="震動開關"></button>
<div class="panel" id="menu">
  <h2>抱抱鴨・接住小鴨</h2>
  <input id="nameIn" maxlength="10" placeholder="輸入你的名字" autocomplete="off">
  <button class="big" id="soloBtn"><span data-ic="chick" data-size="30"></span>單人模式</button>
  <button class="big" id="duoBtn"><span data-ic="duo" data-size="30"></span>雙人連線</button>
  <button class="big" id="multiBtn"><span data-ic="party" data-size="30"></span>多人派對</button>
  <button id="boardBtn"><span data-ic="trophy"></span>排行榜</button>
  <button id="dexBtn"><span data-ic="book"></span>鴨子圖鑑</button>
  <button id="shopBtn"><span data-ic="shop"></span>鴨商城</button>
</div>
<div class="panel hidden" id="duo">
  <h2 id="duoTitle">雙人連線</h2>
  <div id="roomJoin" style="display:flex;flex-direction:column;gap:12px">
    <button class="big" id="createBtn">建立房間</button>
    <div class="row"><input id="codeIn" inputmode="numeric" maxlength="4" placeholder="房間號碼" autocomplete="off"><button id="joinBtn">加入</button></div>
  </div>
  <div class="msg" id="duoMsg"></div>
  <ul class="lobby hidden" id="lobby"></ul>
  <button class="big hidden" id="startBtn">開始派對</button>
  <button class="hidden" id="inviteBtn"><span data-ic="send"></span>傳邀請連結給朋友</button>
  <button class="link" id="backBtn">← 返回</button>
</div>
<div class="panel hidden" id="board">
  <h2><span data-ic="trophy" data-size="26"></span>排行榜</h2>
  <div class="tabs"><button class="tab on" data-m="solo">單人</button><button class="tab" data-m="duo">雙人合作</button></div>
  <ol class="list" id="boardList"></ol>
  <button id="boardShare"><span data-ic="send"></span>分享給朋友</button>
  <button class="link" id="boardBack">← 返回</button>
</div>
<div class="panel hidden" id="dex">
  <h2><span data-ic="book" data-size="26"></span>鴨子圖鑑</h2>
  <div class="msg" id="dexCount"></div>
  <ul class="dexlist" id="dexList"></ul>
  <button class="link" id="dexBack">← 返回</button>
</div>
<div class="achv" id="achv"></div>
<div class="panel hidden" id="shop">
  <h2><span data-ic="shop" data-size="26"></span>鴨商城</h2>
  <div class="msg shop-coins" id="shopCoins"></div>
  <div class="tabs"><button class="tab on" data-k="big">大鴨造型</button><button class="tab" data-k="small">小鴨夥伴</button><button class="tab" data-k="decor">場景佈置</button></div>
  <div class="msg" id="shopHint"></div>
  <ul class="shoplist" id="shopList"></ul>
  <button class="link" id="shopBack">← 返回</button>
</div>
<div class="coins" id="coins"></div>
<div class="card hidden" id="submit">
  <div class="msg" id="submitText"></div>
  <div class="row"><button class="big" id="submitBtn">登記成績</button><button id="shareScoreBtn"><span data-ic="send" data-size="18"></span>分享</button></div>
  <button class="link" id="skipBtn">不用了</button>
</div>
<div class="hint" id="hint">小鴨掉下來時，看準時機按「接住！」<span data-ic="sound" data-size="16"></span></div>
<script type="module" src="./main.js"></script>
</body>
</html>
